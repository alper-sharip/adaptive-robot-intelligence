[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ari"
version = "0.1.0"
description = "Adaptive Robot Intelligence: autonomous robotic manipulation in simulation"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.1", "numpy", "matplotlib", "opencv-python-headless", "pillow"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
